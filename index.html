<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>24RADAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#05070a; --panel:#0d1117; --panel2:#131a22; --border:#232c36;
    --text:#e6edf3; --dim:#7d8a99;
    --blue:#3d8bfd; --red:#e5484d; --green:#2ea043; --orange:#d29922;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; overflow:hidden; }
  body { font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); }
  #app { position:relative; height:100vh; width:100vw; }

  #topbar {
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:rgba(10,13,18,0.92); border-bottom:1px solid var(--border);
  }
  #topbar .brand { font-weight:700; font-size:15px; letter-spacing:.5px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:5px 9px; }
  .chip b { color:var(--text); font-weight:600; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--green); }
  .dot.mock { background:var(--orange); }
  .dot.err { background:var(--red); }
  #topbar .spacer { flex:1; }
  .btn { font-family:'Inter',sans-serif; font-size:11px; font-weight:600; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 11px; border-radius:5px; cursor:pointer; }
  .btn:hover { border-color:var(--blue); }
  .btn.active { background:var(--blue); border-color:var(--blue); color:#04101f; }

  #mapWrap { position:absolute; inset:0; overflow:hidden; cursor:grab; background:#04070c; }
  #mapWrap.grabbing { cursor:grabbing; }
  svg#scene { width:100%; height:100%; display:block; }
  .gridline { stroke:#0c121a; stroke-width:1; }

  .apBadge { background:rgba(10,13,18,0.92); border:1px solid var(--border); border-radius:6px; padding:6px 8px; width:180px; user-select:none; }
  .apBadge .icaoRow { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; gap:6px; }
  .apBadge .icao { font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .apBadge .q { font-size:10px; color:var(--dim); }
  .apBadge .posRow { display:flex; gap:3px; }
  .posChip { flex:1; text-align:center; font-size:10px; font-weight:700; border-radius:3px; padding:3px 0; color:#04101f; opacity:0.28; }
  .posChip.on { opacity:1; }
  .posChip.TWR { background:var(--red); }
  .posChip.GND { background:var(--green); }
  .posChip.CTR { background:var(--blue); }

  .acLabel { font-size:10px; font-weight:600; fill:var(--blue); }
  .acLabel.emg { fill:var(--red); font-weight:700; }
  .acSub { font-size:9px; fill:var(--dim); }

  #zoomctl { position:absolute; right:12px; bottom:12px; z-index:20; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  #zoomctl button { width:32px; height:32px; background:transparent; border:none; color:var(--text); font-size:16px; cursor:pointer; border-bottom:1px solid var(--border); }
  #zoomctl button:last-child { border-bottom:none; }
  #zoomctl button:hover { background:var(--panel2); }

  #drawer {
    position:absolute; top:44px; bottom:0; left:0; width:250px; z-index:25; background:var(--panel);
    border-right:1px solid var(--border); display:none; flex-direction:column;
    transform:translateX(-100%); transition:transform .2s ease;
  }
  #drawer.open { display:flex; transform:translateX(0); }
  .phead { padding:10px 14px; border-bottom:1px solid var(--border); font-weight:700; font-size:12px; display:flex; justify-content:space-between; }
  .phead .n { color:var(--dim); font-weight:500; }
  #drawerList { flex:1; overflow-y:auto; }
  .ctlRow { padding:8px 14px; border-bottom:1px solid rgba(35,44,54,0.6); font-size:11px; }
  .ctlRow .p { font-weight:600; color:var(--blue); }
  .ctlRow .t { color:var(--dim); font-size:10px; }
  .drawerSection { padding:6px 14px 3px; font-size:9px; letter-spacing:.5px; color:var(--dim); text-transform:uppercase; }
  .empty { padding:24px 16px; color:var(--dim); font-size:11px; text-align:center; }

  #calibHint {
    position:absolute; left:50%; top:52px; transform:translateX(-50%); z-index:30;
    background:var(--blue); color:#04101f; font-size:11px; font-weight:600;
    padding:7px 14px; border-radius:20px; display:none;
  }
  #calibHint.show { display:block; }

  #footerNote {
    position:absolute; bottom:0; left:0; right:0; z-index:15; text-align:center;
    font-size:10px; color:var(--dim); padding:5px; background:rgba(10,13,18,0.6);
  }

  #detailPanel {
    position:absolute; top:52px; right:12px; z-index:25; width:230px;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    display:none; overflow:hidden;
  }
  #detailPanel.open { display:block; }
  #detailPanel .dhead {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border-bottom:1px solid var(--border);
  }
  #detailPanel .dhead .cs { font-weight:700; font-size:14px; color:var(--blue); }
  #detailPanel .dhead .cs.emg { color:var(--red); }
  #detailPanel .dhead .close { cursor:pointer; color:var(--dim); font-size:14px; line-height:1; padding:2px 4px; }
  #detailPanel .dhead .close:hover { color:var(--text); }
  #detailPanel .pilot { padding:6px 12px; font-size:11px; color:var(--dim); border-bottom:1px solid var(--border); }
  #detailPanel .statGrid { display:grid; grid-template-columns:1fr 1fr; }
  #detailPanel .stat { padding:9px 12px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
  #detailPanel .stat:nth-child(2n) { border-right:none; }
  #detailPanel .stat .label { font-size:9px; letter-spacing:.4px; color:var(--dim); text-transform:uppercase; margin-bottom:3px; }
  #detailPanel .stat .value { font-size:14px; font-weight:600; }
  #detailPanel .emgBanner { background:var(--red); color:#1a0505; font-size:11px; font-weight:700; text-align:center; padding:6px; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:var(--border); }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand">24RADAR</div>
    <div class="chip"><div class="dot mock" id="statusDot"></div><span id="statusText">Not polling</span></div>
    <div class="chip">ATC <b id="ctlCount">0</b></div>
    <div class="chip">Traffic <b id="acCount">0</b></div>
    <div class="chip" id="clockChip">--:--:--Z</div>
    <div class="spacer"></div>
    <button class="btn" id="btnFit">Fit to Traffic</button>
    <button class="btn" id="btnCalib">Calibrate Airport</button>
    <button class="btn" id="btnDrawer">Controllers</button>
    <button class="btn active" id="btnToggle">Start</button>
  </div>

  <div id="calibHint">Click the map where this airport actually is</div>

  <div id="mapWrap">
    <svg id="scene"></svg>
  </div>

  <div id="zoomctl"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>

  <div id="drawer">
    <div class="phead"><span>ATC POSITIONS</span><span class="n" id="drawerCount">0</span></div>
    <div id="drawerList"></div>
  </div>

  <div id="detailPanel">
    <div class="dhead"><span class="cs" id="dpCallsign">—</span><span class="close" id="dpClose">✕</span></div>
    <div class="pilot" id="dpPilot"></div>
    <div id="dpEmergency"></div>
    <div class="statGrid">
      <div class="stat"><div class="label">Ground Speed</div><div class="value" id="dpGS">—</div></div>
      <div class="stat"><div class="label">Altitude</div><div class="value" id="dpAlt">—</div></div>
      <div class="stat"><div class="label">Heading</div><div class="value" id="dpHdg">—</div></div>
      <div class="stat"><div class="label">Aircraft</div><div class="value" id="dpType">—</div></div>
    </div>
  </div>

  <div id="footerNote">Live aircraft &amp; ATC positions via 24data REST polling · flight plan logs need the WebSocket feed (not included in this free version)</div>

</div>

<script>
/* =========================================================================
   24RADAR — polling version
   -------------------------------------------------------------------------
   No persistent connection anywhere. The frontend polls /api/live (a
   Vercel serverless function — see api/live.js) every few seconds. That
   function itself just fetches 24data's REST endpoints server-side and
   returns the JSON — it does not stay running between requests, which is
   why this whole setup is free with no idle server, no sleep timer, no
   card required.

   Same real 24data schema as before for AircraftData and Position[] —
   see api/live.js's docstring for the endpoints used. FlightPlan data
   is WebSocket-only per 24data's docs, so it's not available here.
   ========================================================================= */

const STUDS_PER_NMI = 3307.14286;
const POLL_MS = 5000; // well within 24data's rate limits for a single viewer

// Decorative landmass radius drawn around each calibrated airport, in studs.
// This is NOT measured from real map data (none is available to me) — it's
// a reasonable visual size so airports don't float on bare water. Treat the
// resulting island shape as illustrative, not an accurate coastline trace.
const ISLAND_RADIUS_STUDS = 16000;

// Rough aircraft classification from the 24data `aircraftType` string, used
// only to vary the icon (helicopter vs fixed-wing) and size (widebody vs
// standard). This is a heuristic on the type name, not authoritative data.
function classifyAircraft(type){
  const t = (type || "").toLowerCase();
  if (t.includes("helicopter") || t.includes("heli")) return { kind:"heli", scale:1 };
  const widebody = ["747","777","787","a380","a350","a340","a330","767"].some(k => t.includes(k));
  return { kind:"jet", scale: widebody ? 1.4 : 1 };
}

// Airport ICAO -> friendly name, read off a community-made ATC24 chart the
// user shared (credited to user_NULL83958, not an official source, and I
// can't verify it beyond cross-checking a few codes against 24data's own
// docs examples — e.g. IMLR/IGRV appear in the official FlightPlan sample,
// ISAU/"Sauthemptona" matches the official ATIS sample). Treat unfamiliar
// entries as best-effort, not guaranteed accurate.
const ICAO_NAMES = {
  IDCS: "Saba", ITKO: "Tokyo", IPPH: "Perth", SHV: "Sea Haven",
  ILKL: "Lukla", IGRV: "Grindavik", TVO: "Tavaro", IBTH: "Saint Barthelemy",
  ISCM: "RAF Scampton", IJAF: "Al Najaf", IZOL: "Izolirani", IBLT: "Boltic",
  IMLR: "Mellor", IGAR: "Airbase Garry", IRFD: "Greater Rockford",
  ISKP: "Skopelos", ISAU: "Sauthemptona", ITRC: "Training Centre",
  ICAR: "Larnaca", IPAP: "Paphos", IHEN: "Henstridge", IBAR: "Barra",
  IIAB: "McConnell",
};
function friendlyName(icao){ return ICAO_NAMES[icao] ? `${icao} — ${ICAO_NAMES[icao]}` : icao; }

// Approximate pixel positions read off that same reference chart (900x665
// image), used only as RELATIVE layout data. These are eyeballed from a
// screenshot, not exact — but once you calibrate 2+ real airports against
// live traffic, we can fit a scale+rotation+translation transform from this
// chart's pixel space into real stud space and auto-place everything else
// on the chart at roughly the right spot, without clicking each one by hand.
const CHART_POSITIONS = {
  IDCS:{x:430,y:45}, ITKO:{x:420,y:95}, IPPH:{x:600,y:175}, SHV:{x:655,y:160},
  ILKL:{x:660,y:210}, IGRV:{x:148,y:310}, TVO:{x:148,y:322}, IBTH:{x:495,y:300},
  ISCM:{x:760,y:300}, IJAF:{x:760,y:330}, IZOL:{x:770,y:365}, IBLT:{x:320,y:420},
  IMLR:{x:300,y:450}, IGAR:{x:330,y:480}, IRFD:{x:390,y:470}, ISKP:{x:595,y:415},
  ISAU:{x:120,y:545}, ITRC:{x:400,y:540}, ICAR:{x:610,y:555}, IPAP:{x:735,y:555},
  IHEN:{x:540,y:615}, IBAR:{x:700,y:605}, IIAB:{x:630,y:630},
};

// 2D similarity transform (uniform scale + rotation + translation) fit from
// N>=2 point pairs, least-squares for N>2. Standard Umeyama/orthogonal-
// Procrustes solution, no reflection.
function fitSimilarityTransform(pairs){
  const n = pairs.length;
  let pBar={x:0,y:0}, qBar={x:0,y:0};
  for (const {p,q} of pairs){ pBar.x+=p.x; pBar.y+=p.y; qBar.x+=q.x; qBar.y+=q.y; }
  pBar.x/=n; pBar.y/=n; qBar.x/=n; qBar.y/=n;
  let Sxx=0,Sxy=0,Syx=0,Syy=0, pNormSq=0;
  for (const {p,q} of pairs){
    const px=p.x-pBar.x, py=p.y-pBar.y, qx=q.x-qBar.x, qy=q.y-qBar.y;
    Sxx += px*qx; Sxy += px*qy; Syx += py*qx; Syy += py*qy;
    pNormSq += px*px+py*py;
  }
  const theta = Math.atan2(Sxy-Syx, Sxx+Syy);
  const cos=Math.cos(theta), sin=Math.sin(theta);
  let num=0;
  for (const {p,q} of pairs){
    const px=p.x-pBar.x, py=p.y-pBar.y, qx=q.x-qBar.x, qy=q.y-qBar.y;
    num += qx*(cos*px-sin*py) + qy*(sin*px+cos*py);
  }
  const scale = pNormSq>0 ? num/pNormSq : 1;
  return (pt) => {
    const px=pt.x-pBar.x, py=pt.y-pBar.y;
    return { x: qBar.x + scale*(cos*px-sin*py), y: qBar.y + scale*(sin*px+cos*py) };
  };
}

// Combines your manually-calibrated (clicked) airports with chart-derived
// estimates for everything else on the chart, once 2+ manual points exist.
function getAllAirportCoords(){
  const result = {};
  for (const icao in state.manualCoords) result[icao] = { ...state.manualCoords[icao], estimated:false };
  const pairs = [];
  for (const icao in state.manualCoords){
    if (CHART_POSITIONS[icao]) pairs.push({ p: CHART_POSITIONS[icao], q: state.manualCoords[icao] });
  }
  if (pairs.length >= 2){
    const transform = fitSimilarityTransform(pairs);
    for (const icao in CHART_POSITIONS){
      if (result[icao]) continue;
      result[icao] = { ...transform(CHART_POSITIONS[icao]), estimated:true };
    }
  }
  return result;
}

const state = {
  aircraft: new Map(),
  controllers: [],
  manualCoords: {},   // icao -> {x,y} — only ones you've actually clicked
  polling: false,
  pollTimer: null,
  origin: { x: 0, y: 0 },
  scale: 0.02,
  calibrating: null,
  selectedCallsign: null,
};

try {
  const saved = localStorage.getItem("24radar_airportCoords");
  if (saved) state.manualCoords = JSON.parse(saved);
} catch (e) {}
function saveAirportCoords(){ try { localStorage.setItem("24radar_airportCoords", JSON.stringify(state.manualCoords)); } catch(e){} }

// ---------- Polling ----------
async function pollOnce(){
  try {
    const res = await fetch("/api/live", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const seen = new Set();
    for (const [callsign, d] of Object.entries(data.aircraft || {})) {
      seen.add(callsign);
      state.aircraft.set(callsign, {
        callsign,
        x: d.position?.x ?? 0, y: d.position?.y ?? 0,
        heading: d.heading ?? 0, altitude: d.altitude ?? 0,
        speed: d.speed ?? 0, groundSpeed: d.groundSpeed ?? 0,
        isOnGround: !!d.isOnGround, aircraftType: d.aircraftType ?? "",
        playerName: d.playerName ?? "", isEmergencyOccuring: !!d.isEmergencyOccuring,
      });
    }
    for (const cs of Array.from(state.aircraft.keys())) {
      if (!seen.has(cs)) state.aircraft.delete(cs);
    }
    state.controllers = data.controllers || [];
    setStatus("on", "Live · updated " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("err", "Poll failed: " + e.message);
  }
}
function startPolling(){
  if (state.polling) return;
  state.polling = true;
  document.getElementById("btnToggle").textContent = "Stop";
  pollOnce();
  state.pollTimer = setInterval(pollOnce, POLL_MS);
}
function stopPolling(){
  state.polling = false;
  document.getElementById("btnToggle").textContent = "Start";
  clearInterval(state.pollTimer);
  setStatus("mock", "Not polling");
}
function setStatus(kind, label){
  document.getElementById("statusDot").className = "dot " + kind;
  document.getElementById("statusText").textContent = label;
}
document.getElementById("btnToggle").addEventListener("click", () => {
  if (state.polling) stopPolling(); else startPolling();
});

// ---------- SVG scene ----------
const svg = document.getElementById("scene");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs){ const e = document.createElementNS(NS,tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function resizeSvg(){
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
}
window.addEventListener("resize", resizeSvg);

function worldToScreen(wx, wy){
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;
  return { sx: w/2 + (wx - state.origin.x) * state.scale, sy: h/2 + (wy - state.origin.y) * state.scale };
}
function screenToWorld(sx, sy){
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;
  return { x: state.origin.x + (sx - w/2) / state.scale, y: state.origin.y + (sy - h/2) / state.scale };
}

// Note: the whole <svg> is cleared and rebuilt every frame (see render()
// below), so defs are rebuilt fresh each time too — no point caching them.
function ensureDefs(){
  const defs = el("defs", {});
  const turb = el("filter", { id:"terrainTex", x:"-30%", y:"-30%", width:"160%", height:"160%" });
  turb.appendChild(el("feTurbulence", { type:"fractalNoise", baseFrequency:"0.01 0.015", numOctaves:"3", seed:"11", result:"noise" }));
  turb.appendChild(el("feColorMatrix", { in:"noise", type:"matrix", values:"0 0 0 0 0.14   0 0 0 0 0.17   0 0 0 0 0.19   0 0 0 0.5 0" }));
  defs.appendChild(turb);
  svg.appendChild(defs);
}

// Decorative islands — rendered for every airport we have a real (manually
// calibrated) or chart-derived (estimated) position for, not just ones with
// active ATC right now, so the archipelago actually looks populated. See
// ISLAND_RADIUS_STUDS note above for what the shape itself is (and isn't)
// based on. Estimated islands are drawn a bit fainter, with a dashed ring.
// Small deterministic string hash → used to seed a stable (not re-randomized
// every frame) organic blob shape per airport, so islands look like varied
// coastlines instead of identical circles, without needing real geo data.
function hashSeed(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function makeBlobPath(cx, cy, r, seedStr){
  const seed = hashSeed(seedStr);
  const points = 10;
  let d = "";
  for (let i=0;i<points;i++){
    const angle = (i/points) * Math.PI*2;
    // pseudo-random but stable per-point radius variation
    const wobble = 0.72 + 0.5 * (((seed * (i+1) * 2654435761) % 1000) / 1000);
    const rad = r * wobble;
    const x = cx + Math.cos(angle)*rad, y = cy + Math.sin(angle)*rad;
    d += (i===0 ? "M " : "L ") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  }
  return d + "Z";
}

function renderIslands(allCoords){
  for (const icao in allCoords) {
    const coord = allCoords[icao];
    const p = worldToScreen(coord.x, coord.y);
    // Clamp on-screen size so a fixed stud radius can't balloon to fill the
    // whole viewport when zoomed in tight on a small traffic cluster.
    const r = Math.min(ISLAND_RADIUS_STUDS * state.scale, 220);
    if (r < 3) continue;
    if (p.sx < -r-50 || p.sx > mapWrap.clientWidth+r+50 || p.sy < -r-50 || p.sy > mapWrap.clientHeight+r+50) continue;
    const blobPath = makeBlobPath(p.sx, p.sy, r, icao);
    const clipId = "isleClip-" + icao;
    const clip = el("clipPath", { id: clipId });
    svg.querySelector("defs").appendChild(clip);
    clip.appendChild(el("path", { d: blobPath }));
    const g = el("g", { "clip-path": `url(#${clipId})`, opacity: coord.estimated ? 0.55 : 1 });
    g.appendChild(el("rect", { x:p.sx-r, y:p.sy-r, width:r*2, height:r*2, fill:"#232a33" }));
    g.appendChild(el("rect", { x:p.sx-r, y:p.sy-r, width:r*2, height:r*2, filter:"url(#terrainTex)" }));
    svg.appendChild(g);
    svg.appendChild(el("path", { d: blobPath, fill:"none", stroke:"#3a4550", "stroke-width":1.5, opacity: coord.estimated?0.35:0.6, "stroke-dasharray": coord.estimated ? "5,4" : "none" }));
  }
}

// Purely decorative sector-boundary-style lines, in the visual spirit of
// ATC chart overlays — NOT real Area Control Centre boundary geometry
// (24data doesn't expose that; only which CTR position is staffed, which
// is what the drawer's Airspace/Center section is for). Regenerated from
// the current spread of known airports so it roughly scales with the map
// instead of being a fixed shape unrelated to what's on screen.
function renderSectorLines(allCoords){
  const keys = Object.keys(allCoords);
  if (keys.length < 2) return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const k of keys){ const c=allCoords[k]; minX=Math.min(minX,c.x); maxX=Math.max(maxX,c.x); minY=Math.min(minY,c.y); maxY=Math.max(maxY,c.y); }
  const spanX = Math.max(1,maxX-minX), spanY = Math.max(1,maxY-minY);
  const pad = 0.5;
  const lines = [
    { color:"#c9821a", pts:[[0.15,-pad],[0.35,0.2],[0.5,0.15],[0.65,0.35],[0.6,0.6],[0.8,0.75],[1+pad,0.7]] },
    { color:"#c9821a", pts:[[0.35,0.2],[0.3,0.5],[0.4,0.8],[0.3,1+pad]] },
    { color:"#2f9e64", pts:[[-pad,0.55],[0.2,0.5],[0.45,0.65],[0.7,0.55],[0.9,0.65],[1+pad,0.55]] },
    { color:"#2f9e64", pts:[[0.65,0.35],[0.75,0.15],[0.9,-pad]] },
  ];
  for (const line of lines){
    const pts = line.pts.map(([fx,fy]) => worldToScreen(minX + fx*spanX, minY + fy*spanY));
    const d = pts.map((p,i)=> (i===0?"M ":"L ") + p.sx.toFixed(1)+","+p.sy.toFixed(1)).join(" ");
    svg.appendChild(el("path", { d, fill:"none", stroke:line.color, "stroke-width":1.3, opacity:0.55 }));
  }
}

function render(){
  svg.innerHTML = "";
  ensureDefs();
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;

  const stepPx = STUDS_PER_NMI * 5 * state.scale;
  if (stepPx > 20) {
    const o = worldToScreen(0,0);
    for (let x = o.sx % stepPx; x < w; x += stepPx) svg.appendChild(el("line",{x1:x,y1:0,x2:x,y2:h,class:"gridline"}));
    for (let y = o.sy % stepPx; y < h; y += stepPx) svg.appendChild(el("line",{x1:0,y1:y,x2:w,y2:y,class:"gridline"}));
  }

  const allCoords = getAllAirportCoords();

  const airportMap = new Map();
  for (const pos of state.controllers) {
    if (!airportMap.has(pos.airport)) airportMap.set(pos.airport, []);
    airportMap.get(pos.airport).push(pos);
  }

  renderSectorLines(allCoords);
  renderIslands(allCoords);

  for (const [icao, positions] of airportMap.entries()) {
    const coord = allCoords[icao];
    if (!coord) continue;
    const p = worldToScreen(coord.x, coord.y);
    if (p.sx < -100 || p.sx > w+100 || p.sy < -100 || p.sy > h+100) continue;

    svg.appendChild(el("circle", { cx:p.sx, cy:p.sy, r:5, fill:"#0d1117", stroke:"var(--blue)", "stroke-width":2 }));

    const fo = el("foreignObject", { x:p.sx-4, y:p.sy-56, width:190, height:50 });
    const div = document.createElement("div");
    div.className = "apBadge";
    const chips = ["TWR","GND","CTR"].map(pt => {
      const match = positions.find(x => x.position === pt);
      if (!match) return "";
      const on = !!match.holder;
      return `<div class="posChip ${pt} ${on?'on':''}">${pt}</div>`;
    }).join("");
    const totalQueue = positions.reduce((s,x)=>s+(x.queue?.length||0),0);
    div.innerHTML = `<div class="icaoRow"><div class="icao">${friendlyName(icao)}${coord.estimated?' <span style="color:var(--dim);font-weight:400;">(est.)</span>':''}</div><div class="q">${totalQueue?totalQueue+' queued':''}</div></div><div class="posRow">${chips}</div>`;
    fo.appendChild(div);
    svg.appendChild(fo);
  }

  const acLayer = el("g", {});
  // Simple label-collision avoidance: skip a label if it would overlap one
  // already placed this frame. This is what was actually broken in your
  // screenshot — every aircraft always drew a 2-line label regardless of
  // how many neighbors were nearby, so tight clusters turned into a wall
  // of stacked text. Icons still always render; only text gets thinned.
  const placedLabelBoxes = [];
  const LABEL_W = 130, LABEL_H = 28;
  function overlapsExisting(x, y){
    for (const b of placedLabelBoxes) {
      if (x < b.x+b.w && x+LABEL_W > b.x && y < b.y+b.h && y+LABEL_H > b.y) return true;
    }
    return false;
  }
  const showDetail = state.scale > 0.008; // hide FL/type line when zoomed way out

  // Sort so selected/emergency aircraft (if any logic added later) or just
  // a stable order get label priority; for now, on-ground/slow first so
  // parked clusters don't hog space over aircraft actually in the air.
  const acList = Array.from(state.aircraft.values()).sort((a,b) => (a.isOnGround?1:0)-(b.isOnGround?1:0));

  for (const ac of acList){
    const p = worldToScreen(ac.x, ac.y);
    if (p.sx < -40 || p.sx > w+40 || p.sy < -40 || p.sy > h+40) continue;
    const cls = classifyAircraft(ac.aircraftType);
    const isSelected = ac.callsign === state.selectedCallsign;
    const color = ac.isEmergencyOccuring ? "var(--red)" : (isSelected ? "var(--text)" : (ac.isOnGround ? "var(--dim)" : "var(--blue)"));

    if (isSelected) {
      svg.appendChild(el("circle", { cx:p.sx, cy:p.sy, r:13, fill:"none", stroke:"var(--blue)", "stroke-width":1.5, opacity:0.8 }));
    }

    // Invisible larger hit-circle so clicking near a small icon still selects it.
    const hit = el("circle", { cx:p.sx, cy:p.sy, r:12, fill:"transparent", style:"cursor:pointer;" });
    hit.addEventListener("mousedown", (e) => e.stopPropagation());
    hit.addEventListener("click", (e) => {
      e.stopPropagation();
      state.selectedCallsign = ac.callsign;
      renderDetailPanel();
    });
    acLayer.appendChild(hit);

    const grp = el("g", { transform:`translate(${p.sx},${p.sy}) rotate(${ac.heading}) scale(${cls.scale})`, style:"pointer-events:none;" });
    if (cls.kind === "heli") {
      grp.appendChild(el("circle", { cx:0, cy:0, r:4, fill:"none", stroke:color, "stroke-width":1.6 }));
      grp.appendChild(el("line", { x1:-8, y1:0, x2:8, y2:0, stroke:color, "stroke-width":1.6 }));
      grp.appendChild(el("line", { x1:0, y1:2, x2:0, y2:9, stroke:color, "stroke-width":1.6 }));
    } else {
      // Generic top-down airplane silhouette — same basic shape family as
      // Font Awesome's "plane", Material's "flight" icon, FR24, etc. My own
      // path, not traced from any of them.
      grp.appendChild(el("path", {
        d: "M 0,-11 L 1.5,-7 L 1.5,-1 L 8,4 L 8,6 L 1.5,4 L 1.5,6.5 L 3,8.5 L 3,9.5 L 0,8.5 L -3,9.5 L -3,8.5 L -1.5,6.5 L -1.5,4 L -8,6 L -8,4 L -1.5,-1 L -1.5,-7 Z",
        fill: color,
      }));
    }
    acLayer.appendChild(grp);

    const lx = p.sx+9, ly = p.sy-9;
    if (ac.isEmergencyOccuring || !overlapsExisting(lx, ly-11)) {
      placedLabelBoxes.push({ x:lx, y:ly-11, w:LABEL_W, h:LABEL_H });
      const label = el("text", { class:"acLabel"+(ac.isEmergencyOccuring?" emg":""), x:lx, y:ly });
      label.textContent = ac.callsign + (ac.isEmergencyOccuring ? " ⚠" : "");
      acLayer.appendChild(label);
      if (showDetail) {
        const fl = "FL" + String(Math.round((ac.altitude||0)/100)).padStart(3,"0");
        const sub = el("text", { class:"acSub", x:lx, y:p.sy+2 });
        sub.textContent = fl + (ac.aircraftType ? " · " + ac.aircraftType : "");
        acLayer.appendChild(sub);
      }
    }
  }
  svg.appendChild(acLayer);
}

function fitToTraffic(){
  const pts = Array.from(state.aircraft.values());
  if (!pts.length) { alert("No aircraft data yet — start polling first."); return; }
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const p of pts){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); }
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const spanX = Math.max(1, maxX-minX), spanY = Math.max(1, maxY-minY);
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;
  const scale = Math.min(w/spanX, h/spanY) * 0.8;
  state.origin = { x:cx, y:cy };
  state.scale = Math.max(0.0005, Math.min(0.2, scale));
}

function renderDetailPanel(){
  const panel = document.getElementById("detailPanel");
  const ac = state.selectedCallsign ? state.aircraft.get(state.selectedCallsign) : null;
  if (!ac) { panel.classList.remove("open"); return; }
  panel.classList.add("open");
  document.getElementById("dpCallsign").textContent = ac.callsign;
  document.getElementById("dpCallsign").className = "cs" + (ac.isEmergencyOccuring ? " emg" : "");
  document.getElementById("dpPilot").textContent = ac.playerName ? "Pilot: " + ac.playerName : "";
  document.getElementById("dpEmergency").innerHTML = ac.isEmergencyOccuring ? `<div class="emgBanner">⚠ EMERGENCY DECLARED</div>` : "";
  document.getElementById("dpGS").textContent = Math.round(ac.groundSpeed || 0) + " kts";
  document.getElementById("dpAlt").textContent = Math.round(ac.altitude || 0) + " ft";
  document.getElementById("dpHdg").textContent = Math.round(ac.heading || 0) + "°";
  document.getElementById("dpType").textContent = ac.aircraftType || (ac.isOnGround ? "On ground" : "—");
}
document.getElementById("dpClose").addEventListener("click", () => {
  state.selectedCallsign = null;
  renderDetailPanel();
});

function renderDrawer(){
  const list = state.controllers.filter(p => p.holder).sort((a,b)=>(a.airport+a.position).localeCompare(b.airport+b.position));
  document.getElementById("drawerCount").textContent = list.length;
  document.getElementById("ctlCount").textContent = list.length;
  const wrap = document.getElementById("drawerList");
  if (!list.length){ wrap.innerHTML = `<div class="empty">No controllers online.</div>`; return; }

  // "CTR" is the real position type 24data uses for Area Control Centres —
  // splitting on it (rather than guessing sector boundary shapes) is the
  // accurate way to separate airspace/center staffing from airport ground ops.
  const airports = list.filter(c => c.position !== "CTR");
  const airspace = list.filter(c => c.position === "CTR");

  const rowHtml = (c) => {
    const mins = Math.floor((Date.now()-c.heldSince)/60000);
    return `<div class="ctlRow"><span class="p">${friendlyName(c.airport)} ${c.position}</span><div class="t">${c.holder} · ${mins}m${c.queue?.length?' · '+c.queue.length+' queued':''}</div></div>`;
  };

  let html = "";
  if (airports.length) html += `<div class="drawerSection">AIRPORTS</div>` + airports.map(rowHtml).join("");
  if (airspace.length) html += `<div class="drawerSection">AIRSPACE / CENTER</div>` + airspace.map(rowHtml).join("");
  wrap.innerHTML = html;
}

const mapWrap = document.getElementById("mapWrap");
let dragging=false, dStart=null, originStart=null;
mapWrap.addEventListener("mousedown",(e)=>{
  if (state.calibrating) return;
  dragging=true; mapWrap.classList.add("grabbing");
  dStart={x:e.clientX,y:e.clientY}; originStart={...state.origin};
});
window.addEventListener("mouseup", ()=>{ dragging=false; mapWrap.classList.remove("grabbing"); });
window.addEventListener("mousemove",(e)=>{
  if(!dragging) return;
  state.origin.x = originStart.x - (e.clientX-dStart.x)/state.scale;
  state.origin.y = originStart.y - (e.clientY-dStart.y)/state.scale;
});
mapWrap.addEventListener("wheel",(e)=>{
  e.preventDefault();
  state.scale = Math.max(0.0002, Math.min(2, state.scale * (e.deltaY>0?0.9:1.1)));
},{passive:false});
document.getElementById("zoomIn").addEventListener("click", ()=>{ state.scale=Math.min(2,state.scale*1.25); });
document.getElementById("zoomOut").addEventListener("click", ()=>{ state.scale=Math.max(0.0002,state.scale*0.8); });
document.getElementById("btnFit").addEventListener("click", fitToTraffic);

mapWrap.addEventListener("click", (e) => {
  if (state.calibrating) {
    const rect = mapWrap.getBoundingClientRect();
    const world = screenToWorld(e.clientX-rect.left, e.clientY-rect.top);
    state.manualCoords[state.calibrating] = { x: world.x, y: world.y };
    saveAirportCoords();
    state.calibrating = null;
    document.getElementById("calibHint").classList.remove("show");
    return;
  }
  // Clicked empty water (aircraft hit-circles stopPropagation before this fires) — deselect.
  if (state.selectedCallsign) { state.selectedCallsign = null; renderDetailPanel(); }
});
document.getElementById("btnCalib").addEventListener("click", () => {
  const seen = Array.from(new Set(state.controllers.map(p=>p.airport)));
  const chart = Object.keys(CHART_POSITIONS);
  const known = Array.from(new Set([...seen, ...chart]));
  if (!known.length) { alert("No airport ICAOs known yet — start polling first."); return; }
  const icao = window.prompt("ICAO to calibrate (from live/chart data: " + known.map(friendlyName).join(", ") + "):");
  if (!icao) return;
  state.calibrating = icao.toUpperCase();
  document.getElementById("calibHint").classList.add("show");
});
document.getElementById("btnDrawer").addEventListener("click", (e)=>{ document.getElementById("drawer").classList.toggle("open"); e.currentTarget.classList.toggle("active"); });

function tickClock(){ document.getElementById("clockChip").textContent = new Date().toUTCString().split(" ")[4]+"Z"; }
setInterval(tickClock,1000); tickClock();

function loop(){
  render();
  document.getElementById("acCount").textContent = state.aircraft.size;
  requestAnimationFrame(loop);
}
setInterval(renderDrawer, 1000);
setInterval(renderDetailPanel, 1000);

resizeSvg();
renderDrawer();
requestAnimationFrame(loop);
startPolling();
</script>
</body>
